<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>

/* ============================================================
   PAINEL DE CONTEUDO - linguagem visual Instagram
   fundo claro, cartoes brancos, bordas suaves, azul de acao
   e o gradiente laranja->rosa->roxo da marca.
   ============================================================ */
:root{
  --bg:#FAFAFA;
  --panel:#FFFFFF;
  --panel2:#F7F7F7;
  --line:#DBDBDB;
  --line2:#C7C7C7;
  --ink:#262626;
  --mute:#737373;
  --mute2:#A8A8A8;

  --ig-blue:#0095F6;
  --ig-orange:#F58529;
  --ig-pink:#DD2A7B;
  --ig-purple:#8134AF;
  --ig-indigo:#515BD4;
  --ig-red:#ED4956;
  --ig-green:#00BA7C;
  --ig-grad:linear-gradient(95deg,#F58529 0%,#DD2A7B 45%,#8134AF 72%,#515BD4 100%);

  --c-cyan:#0095F6;
  --c-amber:#F58529;
  --c-magenta:#DD2A7B;
  --c-blue:#515BD4;
  --c-green:#00BA7C;
  --c-red:#ED4956;

  --bad-soft:#FFF0F0;
  --ok:#00BA7C;
  --warn:#F58529;
  --bad:#ED4956;

  /* a mesma pilha que o Instagram usa na web: a fonte do proprio sistema.
     'Instagram Sans' e proprietaria e nao pode ser embutida — quando o
     aparelho a tem instalada, ela e usada; senao cai na fonte do sistema,
     que e exatamente o que o instagram.com mostra. */
  --display:'Instagram Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  --body:var(--display);
  --sans:var(--display);
  /* mesma familia nos numeros — so com os digitos de largura fixa, para as colunas alinharem */
  --mono:var(--display);

  --r:12px;
  --r-sm:8px;
  --sh:0 1px 2px rgba(0,0,0,.04);
}


/* ============================================================
   TEMA ESCURO — paleta do Instagram no modo escuro
   preto puro no fundo, cartões #121212, bordas #262626
   ============================================================ */
@media (prefers-color-scheme: dark){
  :root:not([data-tema="claro"]){
    --bg:#000000;
    --panel:#121212;
    --panel2:#1C1C1E;
    --line:#262626;
    --line2:#363636;
    --ink:#F5F5F5;
    --mute:#A8A8A8;
    --mute2:#737373;

    --ig-blue:#0095F6;
    --ig-orange:#F58529;
    --ig-pink:#FF3D77;
    --ig-purple:#A855F7;
    --ig-indigo:#6B76E8;
    --ig-red:#FF5C68;
    --ig-green:#25D69A;

    --c-cyan:#0095F6;
    --c-amber:#F58529;
    --c-magenta:#FF3D77;
    --c-blue:#6B76E8;
    --c-green:#25D69A;
    --c-red:#FF5C68;

    --ok:#25D69A;
    --warn:#F58529;
    --bad:#FF5C68;
    --bad-soft:rgba(255,92,104,.14);

    --sh:none;
  }
}
:root[data-tema="escuro"]{
  --bg:#000000;
  --panel:#121212;
  --panel2:#1C1C1E;
  --line:#262626;
  --line2:#363636;
  --ink:#F5F5F5;
  --mute:#A8A8A8;
  --mute2:#737373;

  --ig-blue:#0095F6;
  --ig-orange:#F58529;
  --ig-pink:#FF3D77;
  --ig-purple:#A855F7;
  --ig-indigo:#6B76E8;
  --ig-red:#FF5C68;
  --ig-green:#25D69A;

  --c-cyan:#0095F6;
  --c-amber:#F58529;
  --c-magenta:#FF3D77;
  --c-blue:#6B76E8;
  --c-green:#25D69A;
  --c-red:#FF5C68;

  --ok:#25D69A;
  --warn:#F58529;
  --bad:#FF5C68;
  --bad-soft:rgba(255,92,104,.14);

  --sh:none;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;font-feature-settings:'tnum' 1}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;font-variant-numeric:tabular-nums}

/* numeros: sem as setinhas de incremento, em todos os navegadores */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ig-blue);outline-offset:2px}

.pc-spine{display:block;height:3px;width:100%;background:var(--ig-grad)}
.pc-spine i{display:none}

/* ---------- shell: coluna lateral + conteudo ---------- */
.pc-shell{display:grid;grid-template-columns:248px minmax(0,1fr);gap:0;
  max-width:1320px;margin:0 auto;min-height:calc(100vh - 3px);align-items:start}

.pc-side{border-right:1px solid var(--line);background:var(--panel);
  position:sticky;top:0;align-self:start;height:calc(100vh - 3px);overflow-y:auto}
.pc-side-inner{display:flex;flex-direction:column;gap:24px;padding:26px 18px 22px;min-height:100%}

.pc-brand{display:flex;flex-direction:column;gap:5px;padding:0 8px}
.pc-eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pc-title{font-size:21px;letter-spacing:-.02em;line-height:1.2;font-weight:800;text-transform:none;
  background:var(--ig-grad);-webkit-background-clip:text;background-clip:text;color:transparent;width:fit-content}

.pc-tabs{display:flex;flex-direction:column;gap:2px;margin:0;background:transparent;border:0;
  border-radius:0;padding:0;width:100%;box-shadow:none;overflow:visible}
.pc-tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:transparent;border:0;padding:11px 12px;border-radius:var(--r-sm);font-size:14px;
  font-weight:600;color:var(--ink);letter-spacing:0;text-transform:none;transition:background .15s,color .15s}
.pc-tab .ico{font-size:15px;line-height:1;width:20px;text-align:center;color:var(--mute);transition:color .15s}
.pc-tab:hover{background:var(--panel2)}
.pc-tab[aria-selected="true"]{background:var(--panel2);color:var(--ink)}
.pc-tab[aria-selected="true"] .ico{color:var(--ig-pink)}
.pc-tab[aria-selected="true"]{box-shadow:inset 2px 0 0 var(--ig-pink)}

.pc-stamp{margin-top:auto;font-size:11.5px;color:var(--mute);text-align:left;line-height:1.7;
  padding:14px 12px 0;border-top:1px solid var(--line)}
.pc-stamp b{color:var(--ink);font-weight:600}

.pc-main{padding:26px 28px 72px;min-width:0}

@media(max-width:900px){
  .pc-shell{grid-template-columns:1fr}
  .pc-side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
  .pc-side-inner{flex-direction:column;gap:16px;padding:20px 16px}
  .pc-tabs{flex-direction:row;flex-wrap:wrap;gap:6px}
  .pc-tab{width:auto;padding:9px 14px}
  .pc-tab[aria-selected="true"]{box-shadow:none;background:var(--ink);color:var(--bg)}
  .pc-tab[aria-selected="true"] .ico{color:var(--bg)}
  .pc-stamp{margin-top:0;border-top:0;padding:0 4px}
  .pc-main{padding:20px 16px 64px}
}

.pc-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.pc-panel + .pc-panel{margin-top:16px}
.pc-sec{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.pc-sec h2{margin:0;font-size:15px;letter-spacing:-.01em;color:var(--ink);font-weight:700;text-transform:none}
.pc-sec span{font-size:12px;color:var(--mute)}

.pc-grid{display:grid;gap:16px}
.pc-g2{grid-template-columns:1fr 1fr}
.pc-g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:860px){.pc-g2,.pc-g4{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.pc-g2,.pc-g4{grid-template-columns:1fr}}

.pc-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.pc-chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 16px;
  font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0;transition:all .15s}
.pc-chip:hover{border-color:var(--line2);color:var(--ink)}
.pc-chip[aria-pressed="true"]{border-color:var(--ink);color:var(--bg);background:var(--ink)}

.pc-kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.pc-kpi::before{content:"";position:absolute;left:0;right:0;top:0;bottom:auto;width:auto;height:3px;background:var(--kc,var(--line2))}
.pc-kpi h3{margin:0 0 10px;font-size:12px;letter-spacing:.02em;text-transform:uppercase;color:var(--mute);font-weight:600}
.pc-kpi .v{font-size:32px;line-height:1.05;letter-spacing:-.03em;font-weight:800;color:var(--ink)}
.pc-kpi .v small{font-size:16px;font-weight:600;color:var(--mute);margin-left:3px;letter-spacing:0}
.pc-kpi .s{margin-top:8px;font-size:12px;color:var(--mute)}

.pc-scope{position:relative;height:140px;display:flex;align-items:flex-end;gap:4px;padding:0 0 22px;
  border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
.pc-bar{flex:1 1 0;min-width:10px;border-radius:4px 4px 0 0;position:relative;background:var(--bc);opacity:.9;transition:opacity .12s,transform .12s}
.pc-bar:hover,.pc-bar.on{opacity:1;transform:translateY(-2px);box-shadow:none}
.pc-target{position:absolute;left:0;right:0;border-top:1px dashed var(--mute2);pointer-events:none}
.pc-target span{position:absolute;right:0;top:-16px;font-size:10px;letter-spacing:.04em;color:var(--mute);
  background:var(--panel);padding:0 6px;font-weight:600}
.pc-scopefoot{display:flex;justify-content:space-between;font-size:11px;color:var(--mute2);margin-top:10px;font-weight:500;letter-spacing:0}
.pc-tip{margin-top:12px;min-height:36px;font-size:13px;color:var(--mute);letter-spacing:0}
.pc-tip b{color:var(--ink);font-weight:600}

.pc-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);font-weight:600;margin-top:12px;letter-spacing:0;text-transform:none}
.pc-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.pc-stage{padding:13px 0;border-bottom:1px solid var(--line)}
.pc-stage:last-child{border-bottom:0}
.pc-stage .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.pc-stage .nm{font-size:14px;font-weight:600}
.pc-stage .nm em{font-style:normal;font-size:11px;color:var(--mute2);letter-spacing:0;margin-right:8px;font-weight:700}
.pc-stage .val{font-size:13px;font-weight:600}
.pc-stage .val u{text-decoration:none;color:var(--mute2);font-weight:500}
.pc-track{position:relative;height:8px;background:var(--panel2);border-radius:999px}
.pc-fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;transition:width .3s ease}
.pc-tick{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--mute2);border-radius:2px}

.pc-verdict{margin-top:18px;border:1px solid var(--line);border-left:4px solid var(--bad);
  background:var(--panel2);border-radius:var(--r-sm);padding:16px}
.pc-verdict h4{margin:0 0 8px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--bad);font-weight:700}
.pc-verdict p{margin:0 0 10px;font-size:14px}
.pc-verdict p:last-child{margin-bottom:0}
.pc-verdict .fix{color:var(--mute);font-size:13.5px}
.pc-verdict .fix b{color:var(--ink);font-weight:600}
.pc-verdict.good{border-left-color:var(--ok)}
.pc-verdict.good h4{color:var(--ok)}

.pc-goal{padding:14px 0;border-bottom:1px solid var(--line)}
.pc-goal:last-child{border-bottom:0}
.pc-goal .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:8px}
.pc-goal .nm{font-size:14px;font-weight:600}
.pc-goal .pct{font-size:13px;color:var(--mute);font-weight:600}

.pc-form{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:860px){.pc-form{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.pc-form{grid-template-columns:1fr}}
.pc-field{display:flex;flex-direction:column;gap:6px}
.pc-field.wide{grid-column:span 2}
@media(max-width:520px){.pc-field.wide{grid-column:span 1}}
.pc-field label{font-size:12px;color:var(--mute);font-weight:600;letter-spacing:0;text-transform:none}
.pc-field input,.pc-field select{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:11px 12px;font-size:14px;transition:border-color .15s,background .15s}
.pc-field input:focus,.pc-field select:focus{border-color:var(--ig-blue);background:var(--panel);outline:none}
.pc-field .hint{font-size:11.5px;color:var(--mute2)}
.pc-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.pc-btn{background:var(--ig-blue);color:#fff;border:0;border-radius:var(--r-sm);padding:11px 22px;
  font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;transition:filter .15s,background .15s}
.pc-btn:hover{filter:brightness(1.08);background:var(--ig-blue)}
.pc-btn:disabled{opacity:.5;cursor:default}
.pc-btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.pc-btn.ghost:hover{background:var(--panel2);filter:none;color:var(--ink);border-color:var(--line2)}
.pc-btn.danger{color:var(--bad)}
.pc-btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pc-msg{font-size:13px;color:var(--ok);font-weight:600;letter-spacing:0}
.pc-msg.err{color:var(--bad)}

.pc-tablewrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table.pc-t{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
table.pc-t th{text-align:right;padding:10px 12px;font-size:11px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--mute);font-weight:700;border-bottom:1px solid var(--line)}
table.pc-t th:first-child,table.pc-t td:first-child{text-align:left;padding-left:0}
table.pc-t th:nth-child(2),table.pc-t td:nth-child(2){text-align:left}
table.pc-t td{text-align:right;padding:12px;border-bottom:1px solid var(--line);font-weight:500}
table.pc-t tr:hover td{background:var(--panel2)}
table.pc-t td:last-child,table.pc-t th:last-child{padding-right:0}
.pc-fmt{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;letter-spacing:0;text-transform:none}
.pc-fmt i{width:9px;height:9px;border-radius:50%;display:inline-block}
.pc-name{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px;font-weight:500}
.pc-lnk{background:none;border:0;padding:0 0 0 14px;font-size:12.5px;color:var(--ig-blue);font-weight:600;letter-spacing:0;text-transform:none}
.pc-lnk:hover{text-decoration:underline;color:var(--ig-blue)}
.pc-lnk.del{color:var(--mute)}
.pc-lnk.del:hover{color:var(--bad)}

.pc-empty{padding:44px 4px;text-align:center;color:var(--mute)}
.pc-empty strong{display:block;font-size:22px;color:var(--ink);margin-bottom:8px;letter-spacing:-.02em;font-weight:700;text-transform:none}
.pc-empty span{font-size:14px}

.pc-note{font-size:13.5px;color:var(--mute);margin:0;line-height:1.6}
.pc-note b{color:var(--ink);font-weight:600}
.pc-note code{font-size:12.5px;color:var(--ig-purple);background:var(--panel2);padding:2px 6px;border-radius:4px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* ============================================================
   PAINEL v2 — passos, cadeia, validação, aba Posts
   usa apenas os tokens já definidos acima
   ============================================================ */
.pc-passo{display:grid;gap:12px;margin-bottom:26px}
.pc-passo>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pc-passo>header h2{margin:0;font-size:15px;font-weight:700;letter-spacing:-.01em}
.pc-passo>header .ap{font-size:12.5px;color:var(--mute)}
.pc-rot{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.11em;
  text-transform:uppercase;color:var(--mute)}

/* três indicadores */
.pc-tres{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.pc-tres .ind .v{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;
  letter-spacing:-.03em;margin-top:7px}
.pc-tres .ind .ref{font-size:11.5px;color:var(--mute);margin-top:8px}
.pc-tres .ind .ref b{font-weight:600}
.pc-tres .ind .ref.bom b{color:var(--ok)}
.pc-tres .ind .ref.ruim b{color:var(--bad)}
.pc-tres .ind .ref.sem{color:var(--mute2)}
.pc-tres .ind .cx{font-size:11px;color:var(--mute2);margin-top:6px;line-height:1.45}
@media(max-width:700px){.pc-tres{grid-template-columns:1fr;gap:20px}}

/* cadeia */
.pc-etapa{padding:15px 0;border-bottom:1px solid var(--line)}
.pc-etapa:first-child{padding-top:0}
.pc-etapa:last-child{border-bottom:0;padding-bottom:0}
.pc-etapa .top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.pc-etapa .nome{font-size:13.5px;font-weight:600}
.pc-etapa .qtd{font-family:var(--mono);font-size:15px;font-weight:700}
.pc-etapa .qtd u{text-decoration:none;font-size:11px;font-weight:500;color:var(--mute2);margin-left:9px}
.pc-etapa .nome em{font-style:normal;font-family:var(--mono);font-size:10px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--bad);background:var(--bad-soft);
  padding:2px 7px;border-radius:20px;margin-left:9px;vertical-align:1px}
.pc-tr{position:relative;height:10px;background:var(--panel2);border-radius:3px}
.pc-tr i{display:block;height:100%;border-radius:0 3px 3px 0}
.pc-tr s{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55;text-decoration:none}
.pc-etapa .queda{font-size:11.5px;color:var(--mute);margin-top:7px}
.pc-etapa .queda b{font-weight:600}
.pc-etapa .queda b.ok{color:var(--ok)}
.pc-etapa .queda b.ruim{color:var(--bad)}
.pc-etapa.ramo{padding-left:14px;border-left:2px solid var(--line)}
.pc-etapa.ramo .ramo-nota{font-size:11.5px;color:var(--mute2);margin-bottom:12px;font-style:italic}
.pc-etapa.ramo .sub+.sub{margin-top:16px}

/* validação por post */
/* ===== ícones e animações de foco ===== */
.pc-rot .ic{width:15px;height:15px;flex:0 0 auto;margin-right:7px;vertical-align:-3px;
  opacity:.75;transition:opacity .22s ease,transform .22s ease}
.pc-tres .ind:nth-child(1) .pc-rot .ic{color:var(--ig-red)}
.pc-tres .ind:nth-child(2) .pc-rot .ic{color:var(--ok)}
.pc-tres .ind:nth-child(3) .pc-rot .ic{color:var(--ig-purple)}

/* três indicadores do topo: expandem ao passar o mouse */
.pc-tres .ind{padding:10px 12px;margin:-10px -12px;border-radius:var(--r);
  transition:background .22s ease,transform .22s cubic-bezier(.2,.7,.3,1)}
.pc-tres .ind .v{display:block;transform-origin:left center;
  transition:transform .24s cubic-bezier(.2,.7,.3,1),color .22s ease}
.pc-tres .ind .cx{transition:color .22s ease}
.pc-tres .ind:hover{background:var(--panel2)}
.pc-tres .ind:hover .v{transform:scale(1.09)}
.pc-tres .ind:hover .pc-rot .ic{opacity:1;transform:scale(1.12)}
.pc-tres .ind:hover .cx{color:var(--mute)}

/* etapas da cadeia: realce e leve expansão da etapa sob o mouse */
.pc-etapa,.pc-etapa.ramo .sub{padding-left:12px;padding-right:12px;margin-left:-12px;margin-right:-12px;
  border-radius:var(--r-sm);transition:background .2s ease,transform .2s cubic-bezier(.2,.7,.3,1)}
.pc-etapa.ramo{padding-left:14px;margin-left:0}
.pc-etapa:not(.ramo):hover,.pc-etapa.ramo .sub:hover{background:var(--panel2);transform:translateX(3px)}
.pc-etapa .pc-tr,.pc-etapa .top .qtd{transition:transform .2s cubic-bezier(.2,.7,.3,1)}
.pc-etapa:not(.ramo):hover .qtd,.pc-etapa.ramo .sub:hover .qtd{transform:scale(1.07)}
.pc-etapa .top .qtd{display:inline-block;transform-origin:right center}
.pc-etapa.ramo .sub{padding-top:10px;padding-bottom:10px}
.pc-etapa.ramo .sub+.sub{margin-top:6px}

/* validação: a régua não anima — é campo de digitação, não indicador.
   O gráfico de cada publicação cresce para cima e mostra os números. */
.pc-postv{border-radius:var(--r-sm);padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px;

  transition:opacity .2s ease,transform .24s cubic-bezier(.2,.7,.3,1),bottom .24s cubic-bezier(.2,.7,.3,1)}

.pc-seg::before{content:"";position:absolute;left:-10px;right:-10px;bottom:-7px;top:-6px;

  opacity:0;pointer-events:none;transition:opacity .2s ease,top .24s cubic-bezier(.2,.7,.3,1)}

  txComp:            {nome:'Taxa de compartilhamento',  tipo:'taxa', num:'compartilhamentos',den:'alcance',       pct:true},
  txSalv:            {nome:'Taxa de salvamento',        tipo:'taxa', num:'salvamentos',      den:'alcance',       pct:true},
  txVisita:          {nome:'Taxa de visita ao perfil',  tipo:'taxa', num:'visitasPerfil',    den:'alcance',       pct:true},
  txConversao:       {nome:'Conversão em seguidor',     tipo:'taxa', num:'novosSeguidores',  den:'visitasPerfil', pct:true},
  retencao:          {nome:'Retenção',                  tipo:'direta', campo:'retencao',     pct:true}
};

const PERIODOS = {
  '7':'Últimos 7 dias', '30':'Últimos 30 dias', '90':'Últimos 90 dias',
  'mes':'Mês corrente', 'ano':'Ano corrente', 'tudo':'Todo o histórico', 'custom':'Personalizado'
};

const AGREGACOES = {
  soma:   {soma:'Soma no período', media:'Média por post', maximo:'Melhor post'},
  taxa:   {consolidada:'Consolidada (total ÷ total)', media:'Média por post', maximo:'Melhor post'},
  direta: {media:'Média por post', maximo:'Melhor post'},

};

/* Nao existe meta padrao avulsa: toda metrica do painel ja tem a sua meta
   nos blocos acima (Como esta a pagina e Dados de engajamento no mes).
   "Metas extras" e so para cruzamentos que o painel nao mostra. */
const DEFAULT_METAS = [];

/* metas que duplicavam indicadores do painel — removidas de quem ja tinha o painel salvo */
const METAS_REMOVIDAS = ['m1','m2','m3','m4','m5'];

function metaVazia(){

          formato:'todos', persona:'todos', direcao:'min', alvo:10000};

const DEFAULT_BENCH = {

  salvamento: 1,
  visitaPerfil: 2,    // visitas / alcance %
  conversao: 10       // seguidores / visitas %
};

const DEFAULT_VALID = { views:0, curtidas:0, compart:0, salvos:0 };  // 0 = usar sugestão automática
const DEFAULT_TOPO  = { validadas:0, novosSeg:0 };                   // 0 = derivar automaticamente

/* metas da cadeia em numero absoluto no mes. 0 = derivar da porcentagem do DEFAULT_BENCH */
const DEFAULT_ALVO = { alcance:0, salvamento:0, compartilhamento:0 };

let state = {

  metas: DEFAULT_METAS.map(m=>({...m})),
  bench: {...DEFAULT_BENCH},

let ui = { tab:'painel', periodo:30, editId:null, msg:null, ordem:'data', draft:null };

/* arquivo semanal vindo do servidor — carregado sob demanda ao abrir a aba */
let hist = { estado:'inicio', itens:[], erro:null, a:null, b:null, cache:{} };

/* ---------- persistência em camadas ----------
   Toda alteração é gravada ao mesmo tempo em todas as camadas disponíveis:
   1. arquivo .json no computador  → escolhido pelo usuário, sobrevive a tudo
   2. window.storage               → dentro do Claude
   3. localStorage                 → navegador, sobrevive a fechar a aba
   Na abertura, lê as três e usa a mais recente (campo salvoEm).            */
const CHAVE_RASCUNHO = KEY + ':rascunho';
const CHAVE_BACKUP   = KEY + ':backup';
const IDB_NOME = 'editorx-conteudo-db';
const IDB_STORE = 'handles';

let motor = 'checando';        // resumo de onde salvou: 'arquivo' | 'claude' | 'navegador' | 'memoria'
let destinos = [];             // lista completa dos destinos que aceitaram a última gravação
let persistente = true;
let ultimoSalvo = null;
let salvando = false;
let timerRascunho = null;
let rascunho = null;
let podeDesfazer = false;
let arquivoHandle = null;      // handle do .json vinculado, se houver
let arquivoNome = null;
let arquivoVinculado = false;  // handle existe E com permissão concedida

const suportaArquivo = typeof window !== 'undefined' && typeof window.showSaveFilePicker === 'function';

/* --- IndexedDB: guarda só o handle do arquivo entre sessões --- */
function idbAbrir(){
  return new Promise((ok, err)=>{
    if(!window.indexedDB) return err(new Error('sem indexedDB'));
    const req = indexedDB.open(IDB_NOME, 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
    req.onsuccess = ()=>ok(req.result);
    req.onerror = ()=>err(req.error);
  });
}
async function idbSet(k,v){
  try{
    const db = await idbAbrir();
    await new Promise((ok,err)=>{
      const tx = db.transaction(IDB_STORE,'readwrite');
      tx.objectStore(IDB_STORE).put(v,k);
      tx.oncomplete = ok; tx.onerror = ()=>err(tx.error);
    });
  }catch(e){}
}
async function idbGet(k){
  try{
    const db = await idbAbrir();
    return await new Promise((ok,err)=>{
      const tx = db.transaction(IDB_STORE,'readonly');
      const r = tx.objectStore(IDB_STORE).get(k);
      r.onsuccess = ()=>ok(r.result); r.onerror = ()=>err(r.error);
    });
  }catch(e){ return undefined; }
}

/* --- permissão do arquivo vinculado --- */
async function permissaoArquivo(pedir){
  if(!arquivoHandle) return false;
  try{
    const atual = await arquivoHandle.queryPermission({mode:'readwrite'});
    if(atual === 'granted') return true;
    if(!pedir) return false;
    return (await arquivoHandle.requestPermission({mode:'readwrite'})) === 'granted';
  }catch(e){ return false; }
}

/* --- escrita: tenta todas as camadas, devolve quais aceitaram --- */
async function escreverArquivo(texto){
  if(!arquivoHandle) return false;
  if(!(await permissaoArquivo(false))) return false;
  try{
    const w = await arquivoHandle.createWritable();
    await w.write(texto); await w.close();
    return true;
  }catch(e){ return false; }
}
function escreverLocal(chave, texto){
  try{ localStorage.setItem(chave, texto); return true; }catch(e){ return false; }
}
async function escreverClaude(chave, texto){
  if(!(window && window.storage)) return false;
  try{ await window.storage.set(chave, texto); return true; }catch(e){ return false; }
}

async function escrever(chave, texto){
  const local = escreverLocal(chave, texto);
  const claude = await escreverClaude(chave, texto);
  // só o estado principal vai para o arquivo do usuário; rascunho e backup ficam nas camadas rápidas
  const arquivo = (chave === KEY) ? await escreverArquivo(texto) : false;

  if(chave === KEY){
    arquivoVinculado = arquivo;
    destinos = [];
    if(arquivo) destinos.push('arquivo');
    if(claude) destinos.push('claude');
    if(local) destinos.push('navegador');
    motor = destinos[0] || 'memoria';
  }
  return (local || claude || arquivo);
}

/* --- leitura: junta as camadas e fica com a versão mais recente --- */
function lerLocal(chave){ try{ return localStorage.getItem(chave); }catch(e){ return null; } }
async function lerClaude(chave){
  if(!(window && window.storage)) return null;
  try{ const r = await window.storage.get(chave); return (r && r.value) || null; }
  catch(e){ return null; }   // chave inexistente lança erro
}
async function lerArquivo(){
  if(!arquivoHandle) return null;
  if(!(await permissaoArquivo(false))) return null;
  try{ const f = await arquivoHandle.getFile(); return await f.text(); }
  catch(e){ return null; }
}

async function ler(chave){
  const doLocal = lerLocal(chave);
  const doClaude = await lerClaude(chave);
  return doClaude || doLocal;
}

async function remover(chave){
  try{ localStorage.removeItem(chave); }catch(e){}
  if(window && window.storage){
    try{ await window.storage.delete(chave); }catch(e){}
  }
}

const carimbo = txt => {
  try{ const o = JSON.parse(txt); return o && o.salvoEm ? (Date.parse(o.salvoEm)||0) : 0; }
  catch(e){ return -1; }
};

/* aceita tanto o formato novo (metas em lista) quanto o antigo (metas fixas) */
function aplicar(d){
  let metas = Array.isArray(d.metas) ? d.metas : [];

  // remove as metas que duplicavam indicadores que o painel ja mostra
  metas = metas.filter(m => !METAS_REMOVIDAS.includes(m.id));

  // formato antigo (metas fixas em objeto): as percentuais viram a cadeia de engajamento
  const bench = {...DEFAULT_BENCH, ...(d.bench||{})};
  if(d.metas && !Array.isArray(d.metas) && typeof d.metas==='object'){
    const o = d.metas;
    if(o.engajamento!=null && d.bench==null) bench.engajamento = Number(o.engajamento);
    if(o.salvamento!=null  && d.bench==null) bench.salvamento  = Number(o.salvamento);
  }

  state = {
    posts: Array.isArray(d.posts) ? d.posts : [],
    metas,
    bench,
    valid: {...DEFAULT_VALID, ...(d.valid||{})},
    topo:  {...DEFAULT_TOPO,  ...(d.topo||{})},
    alvo:  {...DEFAULT_ALVO,  ...(d.alvo||{})},
    seguidores: Number(d.seguidores)||0,
    exportadoEm: d.exportadoEm || null,
    salvoEm: d.salvoEm || null
  };
}

async function carregar(){
  // recupera o arquivo vinculado da sessão anterior
  try{
    const h = await idbGet('arquivoHandle');
    if(h){ arquivoHandle = h; arquivoNome = h.name || 'arquivo.json'; }
  }catch(e){ arquivoHandle = null; }

  const [doArquivo, doClaude] = await Promise.all([lerArquivo(), lerClaude(KEY)]);
  const doLocal = lerLocal(KEY);

  const candidatos = [doArquivo, doClaude, doLocal].filter(t => t && carimbo(t) >= 0);
  if(candidatos.length){
    candidatos.sort((a,b)=>carimbo(b)-carimbo(a));
    try{ aplicar(JSON.parse(candidatos[0])); ultimoSalvo = new Date(); }catch(e){}
  }

  const r = await ler(CHAVE_RASCUNHO);
  if(r){ try{ rascunho = JSON.parse(r); }catch(e){} }
  const b = await ler(CHAVE_BACKUP);
  podeDesfazer = !!b;

  // descobre quais camadas estão disponíveis, mesmo antes da primeira gravação
  destinos = [];
  arquivoVinculado = arquivoHandle ? await permissaoArquivo(false) : false;
  if(arquivoVinculado) destinos.push('arquivo');
  if(window && window.storage) destinos.push('claude');
  if(escreverLocal(KEY + ':teste','1')){ destinos.push('navegador'); try{ localStorage.removeItem(KEY+':teste'); }catch(e){} }
  motor = destinos[0] || 'memoria';
  persistente = destinos.length > 0;
}

async function salvar(){
  salvando = true; pintarSalvo();
  state.salvoEm = new Date().toISOString();
  const ok = await escrever(KEY, JSON.stringify(state));
  salvando = false;
  persistente = ok;
  if(ok) ultimoSalvo = new Date();
  pintarSalvo();
  return ok;
}

/* vincular um .json do computador: a partir daí toda alteração é escrita nele */
async function vincularArquivo(){
  try{
    if(arquivoHandle){
      if(await permissaoArquivo(true)){
        const txt = await lerArquivo();
        if(txt && carimbo(txt) > carimbo(JSON.stringify(state))){
          try{ aplicar(JSON.parse(txt)); }catch(e){}
        }
        await salvar();
        return true;
      }
    }
    const h = await window.showSaveFilePicker({
      suggestedName: 'painel-conteudo.json',
      types: [{description:'Dados do painel', accept:{'application/json':['.json']}}]
    });
    arquivoHandle = h;
    arquivoNome = h.name || 'painel-conteudo.json';
    await idbSet('arquivoHandle', h);
    await salvar();
    return true;
  }catch(e){ return false; }   // usuário cancelou
}

async function desvincularArquivo(){
  arquivoHandle = null; arquivoNome = null; arquivoVinculado = false;
  await idbSet('arquivoHandle', null);
  await salvar();
}

/* guarda uma cópia antes de operações destrutivas */
async function guardarBackup(){
  const ok = await escrever(CHAVE_BACKUP, JSON.stringify(state));
  podeDesfazer = ok;
}

/* rascunho do formulário de post, gravado enquanto você digita */
function agendarRascunho(dados){
  clearTimeout(timerRascunho);
  salvando = true; pintarSalvo();
  timerRascunho = setTimeout(async ()=>{
    rascunho = {...dados, em:new Date().toISOString()};
    await escrever(CHAVE_RASCUNHO, JSON.stringify(rascunho));
    salvando = false; ultimoSalvo = new Date(); pintarSalvo();
  }, 600);
}
async function limparRascunho(){ clearTimeout(timerRascunho); rascunho = null; await remover(CHAVE_RASCUNHO); }

function horaCurta(d){ return d ? String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0') : '—'; }
function diasDesde(iso){ if(!iso) return null; return Math.max(0, Math.floor((Date.now()-new Date(iso).getTime())/86400000)); }

function nomeDestino(d){
  return d==='arquivo' ? 'no arquivo' : d==='claude' ? 'no Claude' : 'neste navegador';
}
function textoSalvo(){
  if(salvando) return {t:'Salvando…', c:'var(--mute)'};
  if(!destinos.length) return {t:'Sem salvamento — exporte o JSON', c:'var(--bad)'};
  const onde = destinos.map(nomeDestino).join(' + ').replace(/ \+ (?=[^+]*$)/, ' e ');
  return {t:`Salvo automaticamente ${onde}${ultimoSalvo?' · '+horaCurta(ultimoSalvo):''}`, c:'var(--ok)'};
}

/* atualiza só o indicador, sem redesenhar a tela inteira */
function pintarSalvo(){
  const el = document.getElementById('salvo');
  if(!el) return;
  const s = textoSalvo();
  el.textContent = s.t;
  el.style.color = s.c;
}

/* ============================================================
   HELPERS
   ============================================================ */
const n  = v => Number(v)||0;
const N  = v => n(v).toLocaleString('pt-BR');
const P  = (v,d=1) => (Number.isFinite(v) ? v.toFixed(d).replace('.',',') : '—');
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const hoje = () => new Date().toISOString().slice(0,10);
const dataBR = s => s ? s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4) : '—';

function interacoes(p){ return n(p.curtidas)+n(p.comentarios)+n(p.compartilhamentos)+n(p.salvamentos); }
function taxa(num, den){ den=n(den); return den>0 ? (n(num)/den)*100 : null; }
function engaj(p){ return taxa(interacoes(p), p.alcance); }

function postsFiltrados(){
  const lista = [...state.posts].sort((a,b)=> a.data < b.data ? -1 : 1);
  if(ui.periodo==='tudo') return lista;
  const lim = new Date(); lim.setDate(lim.getDate()-Number(ui.periodo));
  const iso = lim.toISOString().slice(0,10);
  return lista.filter(p=>p.data>=iso);
}

function media(lista, fn){
  const vs = lista.map(fn).filter(v=>v!==null && Number.isFinite(v));
  return vs.length ? vs.reduce((a,b)=>a+b,0)/vs.length : null;
}
function soma(lista, campo){ return lista.reduce((a,p)=>a+n(p[campo]),0); }

function corStatus(v, alvo){
  if(v===null) return 'var(--mute2)';
  if(v>=alvo) return 'var(--ok)';
  if(v>=alvo*0.6) return 'var(--warn)';
  return 'var(--bad)';
}

/* ============================================================
   MOTOR DE METAS
   ============================================================ */
function inicioJanela(periodo, dias){
  const d = new Date();
  if(periodo==='tudo') return null;
  if(periodo==='mes') return new Date(d.getFullYear(), d.getMonth(), 1).toISOString().slice(0,10);
  if(periodo==='ano') return new Date(d.getFullYear(), 0, 1).toISOString().slice(0,10);
  const k = periodo==='custom' ? (n(dias)||30) : (Number(periodo)||30);
  d.setDate(d.getDate()-k);
  return d.toISOString().slice(0,10);
}

function escopoMeta(m){
  let l = [...state.posts];
  const ini = inicioJanela(m.periodo, m.dias);
  if(ini) l = l.filter(p=>p.data>=ini);
  if(m.formato && m.formato!=='todos') l = l.filter(p=>p.formato===m.formato);
  if(m.persona && m.persona!=='todos') l = l.filter(p=>p.persona===m.persona);
  return l;
}

function valorMeta(m){
  const M = METRICAS[m.metrica];
  if(!M) return {valor:null, amostra:0};
  const l = escopoMeta(m);
  const v = p => M.campo==='__inter' ? interacoes(p) : n(p[M.campo]);

  if(M.tipo==='contagem') return {valor:l.length, amostra:l.length};
  if(!l.length) return {valor: M.tipo==='soma' ? 0 : null, amostra:0};

  if(M.tipo==='soma'){
    if(m.agregacao==='media')  return {valor: l.reduce((a,p)=>a+v(p),0)/l.length, amostra:l.length};
    if(m.agregacao==='maximo') return {valor: Math.max(...l.map(v)), amostra:l.length};
    return {valor: l.reduce((a,p)=>a+v(p),0), amostra:l.length};
  }

  if(M.tipo==='direta'){
    const vs = l.map(p=>p[M.campo]).filter(x=>x!==null && x!=='' && x!==undefined).map(n);
    if(!vs.length) return {valor:null, amostra:0};
    if(m.agregacao==='maximo') return {valor: Math.max(...vs), amostra:vs.length};
    return {valor: vs.reduce((a,b)=>a+b,0)/vs.length, amostra:vs.length};
  }

  if(M.tipo==='taxa'){
    const num = p => M.num==='__inter' ? interacoes(p) : n(p[M.num]);
    const den = p => n(p[M.den]);
    if(m.agregacao==='media' || m.agregacao==='maximo'){
      const vs = l.filter(p=>den(p)>0).map(p=>num(p)/den(p)*100);
      if(!vs.length) return {valor:null, amostra:0};
      return {valor: m.agregacao==='maximo' ? Math.max(...vs) : vs.reduce((a,b)=>a+b,0)/vs.length, amostra:vs.length};
    }
    const tn = l.reduce((a,p)=>a+num(p),0), td = l.reduce((a,p)=>a+den(p),0);
    return {valor: td>0 ? tn/td*100 : null, amostra:l.length};
  }
  return {valor:null, amostra:0};
}

function fmtMeta(m, valor){
  if(valor===null) return '—';
  const M = METRICAS[m.metrica];
  return M && M.pct ? P(valor,2)+'%' : N(Math.round(valor));
}

function progressoMeta(m){
  const {valor, amostra} = valorMeta(m);
  const alvo = n(m.alvo);
  let pct = 0, ok = false;
  if(valor!==null && alvo>0){
    if(m.direcao==='max'){ ok = valor<=alvo; pct = ok ? 100 : Math.max(0, (alvo/valor)*100); }
    else { ok = valor>=alvo; pct = Math.min((valor/alvo)*100, 100); }
  }
  const cor = valor===null ? 'var(--mute2)' : ok ? 'var(--ok)' : pct>=60 ? 'var(--warn)' : 'var(--bad)';
  return {valor, amostra, alvo, pct, ok, cor};
}

function tipoAgregacao(metrica){
  const M = METRICAS[metrica]; if(!M) return 'soma';
  return M.tipo==='taxa' ? 'taxa' : M.tipo==='direta' ? 'direta' : M.tipo==='contagem' ? 'contagem' : 'soma';
}

function rotuloPeriodo(m){
  if(m.periodo==='custom') return `Últimos ${n(m.dias)||30} dias`;
  return PERIODOS[m.periodo] || m.periodo;
}

function descreveMeta(m){
  const M = METRICAS[m.metrica] || {nome:'—'};
  const ag = AGREGACOES[tipoAgregacao(m.metrica)][m.agregacao] || '';
  const filtros = [];
  if(m.formato && m.formato!=='todos') filtros.push(m.formato);
  if(m.persona && m.persona!=='todos') filtros.push('persona '+m.persona);
  return [M.nome, ag, rotuloPeriodo(m)].concat(filtros).join(' · ');
}

function nomeSugerido(m){
  const M = METRICAS[m.metrica] || {nome:''};
  return `${M.nome} — ${rotuloPeriodo(m).toLowerCase()}`;
}

/* ============================================================
   FUNIL / DIAGNÓSTICO
   ============================================================ */
function funil(lista){
  const b = state.bench;
  const alcanceTotal = soma(lista,'alcance');
  const visitas = soma(lista,'visitasPerfil');

  return [
    { id:'distribuicao', cod:'01', nome:'Distribuição', unidade:'% da base alcançada',
      valor: state.seguidores>0 ? (alcanceTotal/lista.length)/state.seguidores*100 : null,
      alvo:b.distribuicao,
      diag:'O algoritmo testa e desiste. O problema mora nos 3 primeiros segundos: primeiro frame parado, abertura genérica ou corte lento demais.',
      fix:'Troque o gancho, não o tema. Primeiro frame com movimento, texto de abertura nomeando quem é o alvo, primeiro corte antes de 1,2s.' },

    { id:'retencao', cod:'02', nome:'Retenção', unidade:'% assistido em média',
      valor: media(lista, p=>p.retencao!=null && p.retencao!=='' ? n(p.retencao) : null),
      alvo:b.retencao,
      diag:'Entram e saem. O vídeo tem gordura: silêncio, respiro, explicação antes da prova.',
      fix:'Corte 20% da duração e mate todo silêncio acima de 250ms — é exatamente o que seu pipeline de silence detection já faz. Prova visual antes do argumento.' },

    { id:'engajamento', cod:'03', nome:'Interação', unidade:'% do alcance',
      valor: media(lista, engaj), alvo:b.engajamento,
      diag:'Alcança e não gera reação. O conteúdo entrega informação, não posicionamento.',
      fix:'Falta tensão. Nomeie o vilão ("tá bom assim") e defenda um lado. Conteúdo neutro não é comentado.' },

    { id:'compartilhamento', cod:'04', nome:'Compartilhamento', unidade:'% do alcance',
      valor: media(lista, p=>taxa(p.compartilhamentos,p.alcance)), alvo:b.compartilhamento,
      diag:'Ninguém se identifica a ponto de mandar pra outra pessoa.',
      fix:'Compartilhamento é identificação, não utilidade. Descreva a dor de um perfil específico com precisão suficiente para alguém marcar um amigo.' },

    { id:'salvamento', cod:'05', nome:'Salvamento', unidade:'% do alcance',
      valor: media(lista, p=>taxa(p.salvamentos,p.alcance)), alvo:b.salvamento,
      diag:'Não tem valor de consulta. Nada ali serve para depois.',
      fix:'Inclua um critério, um checklist ou um antes/depois que a pessoa vai querer reabrir na hora de contratar ou executar.' },

    { id:'visitaPerfil', cod:'06', nome:'Visita ao perfil', unidade:'% do alcance',
      valor: taxa(visitas, alcanceTotal), alvo:b.visitaPerfil,
      diag:'Assistem e não te procuram. Não fica claro o que você faz nem por que teria autoridade pra dizer aquilo.',
      fix:'Assinatura visual no final e uma frase que force curiosidade sobre você, não sobre o tema.' },

    { id:'conversao', cod:'07', nome:'Conversão em seguidor', unidade:'% das visitas',
      valor: taxa(soma(lista,'novosSeguidores'), visitas), alvo:b.conversao,
      diag:'Chegam no perfil e voltam. O gargalo aqui não é o conteúdo — é o perfil.',
      fix:'Nome indexado com a palavra-chave, bio com mecanismo (não com adjetivo), primeiras 6 capas com marca d\'água e prova. Conteúdo bom não salva perfil fraco.' }
  ];
}

function gargalo(estagios){
  const comDados = estagios.filter(e=>e.valor!==null);
  if(!comDados.length) return null;
  const abaixo = comDados.filter(e=> e.valor < e.alvo);
  if(!abaixo.length) return {tipo:'ok'};
  // o primeiro estágio abaixo da meta mascara todos os seguintes
  const alvo = abaixo[0];
  return {tipo:'gargalo', e:alvo, deficit:(1 - alvo.valor/alvo.alvo)*100};
}

  if(ui.tab==='metas')     v.innerHTML = viewMetas();
  if(ui.tab==='historico') v.innerHTML = viewHistorico();
  ligarEventos();
}

/* ---------- VALIDAÇÃO ---------- */
const VCOMP = [
  {k:'views',    rot:'visualizações',    cor:'var(--c-cyan)',    campo:'views',            ico:'olho'},
  {k:'curtidas', rot:'curtidas',          cor:'var(--ig-red)',    campo:'curtidas',         ico:'reacoes'},
  {k:'compart',  rot:'compartilhamentos', cor:'var(--ig-purple)', campo:'compartilhamentos',ico:'aviao'},
  {k:'salvos',   rot:'salvamentos',       cor:'var(--c-magenta)', campo:'salvamentos',      ico:'marcador'}
];

function medianaDe(a){ const b=a.slice().sort((x,y)=>x-y), m=b.length>>1;
  return b.length ? (b.length%2 ? b[m] : (b[m-1]+b[m])/2) : 0; }

function metasSugeridas(){
  const P = state.posts;
  if(!P.length) return {views:100, curtidas:10, compart:2, salvos:2};
  return {
    views:    Math.max(1, Math.ceil(medianaDe(P.map(p=>n(p.views)))*1.3)),
    curtidas: Math.max(1, Math.ceil(medianaDe(P.map(p=>n(p.curtidas)))*1.3)),
    compart:  Math.max(1, Math.ceil(medianaDe(P.map(p=>n(p.compartilhamentos)))*1.3)),
    salvos:   Math.max(1, Math.ceil(medianaDe(P.map(p=>n(p.salvamentos)))*1.3))
  };
}
function metasValid(){
  const sug = metasSugeridas(), v = state.valid || {};
  return { views: n(v.views)>0?n(v.views):sug.views,
           curtidas: n(v.curtidas)>0?n(v.curtidas):sug.curtidas,
           compart: n(v.compart)>0?n(v.compart):sug.compart,
           salvos: n(v.salvos)>0?n(v.salvos):sug.salvos };
}
function metaValidadas(){
  const t = state.topo||{};
  if(n(t.validadas)>0) return n(t.validadas);
  return Math.max(1, state.posts.filter(maduro).length);   // padrão: todas
}
function metaNovosSeg(){
  const t = state.topo||{}, b = state.bench;
  if(n(t.novosSeg)>0) return n(t.novosSeg);
  return Math.round(b.visitaPerfil/100 * b.conversao/100 * soma(state.posts,'alcance'));
}

/* --- metas da cadeia, sempre em numero de pessoas no mes ---
   o campo guarda o numero; a porcentagem vira observacao.
   0 no campo = derivar da porcentagem de referencia. */
function metaAlcance(){
  const a = n((state.alvo||{}).alcance); if(a>0) return a;
  return Math.round(state.bench.distribuicao/100 * n(state.seguidores) * (state.posts.length||1));
}
function metaGuardaram(){
  const a = n((state.alvo||{}).salvamento); if(a>0) return a;
  return Math.round(state.bench.salvamento/100 * soma(state.posts,'alcance'));
}
function metaRepassaram(){
  const a = n((state.alvo||{}).compartilhamento); if(a>0) return a;
  return Math.round(state.bench.compartilhamento/100 * soma(state.posts,'alcance'));
}
/* a porcentagem que um numero de meta representa — usada so como observacao */
function pctDe(valor, base){
  if(!base) return null;
  return valor/base*100;
}
const obsPct = (valor, base, sufixo) => {
  const p = pctDe(valor, base);
  return p===null ? 'sem base medida ainda' : `= ${p.toFixed(p<10?1:0).replace('.',',')}% ${sufixo}`;
};

function dataHora(p){ return p.ts ? new Date(p.ts) : (p.data ? new Date(p.data+'T12:00:00Z') : null); }
function maduro(p){ const d=dataHora(p); return d ? (Date.now()-d)/36e5 >= 24 : true; }

function partesValid(p){
  const M = metasValid();
  return VCOMP.map(c => {
    const real = n(p[c.campo]), alvo = M[c.k];
    return {...c, real, alvo, pct: alvo>0 ? Math.min(real/alvo, 1) : 0};
  });
}
function scoreValid(p){
  const q = partesValid(p);
  return q.reduce((a,x)=>a+x.pct,0)/q.length*100;
}

function viewPainel(){
  if(!state.posts.length) return vazio();

  const P = state.posts;
  const ALC = soma(P,'alcance'), INT = soma(P,'interacoes') || soma(P,'curtidas')+soma(P,'comentarios')+soma(P,'compartilhamentos')+soma(P,'salvamentos');
  const SAL = soma(P,'salvamentos'), COM = soma(P,'compartilhamentos');
  const SEG = n(state.seguidores), b = state.bench;

  const maduros = P.filter(maduro);
  const validados = maduros.filter(p=>scoreValid(p)>=100).length;

  /* --- cadeia com metas proprias --- */
  const metaAlc = metaAlcance();
  const metaSal = metaGuardaram();
  const metaCom = metaRepassaram();
  const metaSeg = metaNovosSeg();
  const porPub  = SEG ? (metaAlc/(P.length||1)/SEG*100) : null;
  const novosSeg = n(state.novosSeguidores);
  const mValid = metaValidadas(), mNovos = metaNovosSeg();

  /* porcentagem lida no proprio verbo da etapa: "2,3% guardaram" */
  const pc = (parte, base) => {
    if(!base) return null;
    const v = parte/base*100;
    return v.toFixed(v<10?1:0).replace('.',',')+'%';
  };
  const comVerbo = (parte, base, verbo) => { const t = pc(parte,base); return t ? `${t} ${verbo}` : null; };

  const cadeia = [
    {nome:'Alcance', q:ALC, meta:metaAlc, cor:'var(--c-cyan)',
     obs: SEG ? `${pc(ALC/(P.length||1), SEG)} da base por publicação` : null,
     base:'contas diferentes que viram alguma publicação'},
    {nome:'Reagiram', q:INT, meta:null, cor:'var(--c-blue)',
     obs: comVerbo(INT, ALC, 'reagiram'),
     base:'sem meta — indicador de volume'},
    {ramo:[
      {nome:'Guardaram', q:SAL, meta:metaSal, cor:'var(--c-magenta)',
       obs: comVerbo(SAL, ALC, 'guardaram'),
       base:'salvaram para rever depois'},
      {nome:'Repassaram', q:COM, meta:metaCom, cor:'var(--ig-purple)',
       obs: comVerbo(COM, ALC, 'repassaram'),
       base:'mandaram para outra pessoa'}
    ]},
    {nome:'Passaram a seguir', q:novosSeg, meta:metaSeg, cor:'var(--c-amber)',
     obs: comVerbo(novosSeg, ALC, 'passaram a seguir'),
     base:'começaram a seguir o perfil'}
  ];
  const planas = cadeia.flatMap(e => e.ramo ? e.ramo : [e]);
  const comMeta = planas.filter(e => e.meta !== null);
  const primeiraFora = comMeta.find(e => e.q < e.meta);
  const ramo = cadeia.find(e => e.ramo);
  const piorRamo = ramo ? ramo.ramo.slice().sort((a,c)=>(a.q/a.meta)-(c.q/c.meta))[0] : null;
  const alvoTrava = (primeiraFora && ramo && ramo.ramo.includes(primeiraFora)) ? piorRamo : primeiraFora;

  const sit = e => {
    if(e.meta === null) return '';
    const ok = e.q >= e.meta;
    const t = e.q===0 ? 'nenhuma pessoa'
      : ok ? (e.meta ? (e.q/e.meta).toFixed(1).replace('.',',')+'× a meta' : 'acima da meta')
           : Math.round((1-e.q/e.meta)*100)+'% abaixo da meta';
    return `<b class="${ok?'ok':'ruim'}">${t}</b>`;
  };
  const linhaEt = (e, escala) => {
    const esc2 = escala || Math.max(e.q, e.meta||0)*1.12 || 1;
    const pes = [sit(e), e.obs, e.base].filter(Boolean).join(' · ');
    return `
      <div class="top">
        <span class="nome">${e.nome}${e===alvoTrava?'<em>é aqui que trava</em>':''}</span>
        <span class="qtd">${N(e.q)}${e.meta===null?'<u>sem meta</u>':`<u>meta ${N(e.meta)}</u>`}</span>
      </div>
      <div class="pc-tr">
        <i style="width:${Math.min((e.q/esc2)*100,100)}%;background:${e.cor}"></i>
        ${e.meta===null?'':`<s style="left:${Math.min((e.meta/esc2)*100,100)}%"></s>`}
      </div>
      <div class="queda">${pes}</div>`;
  };

  /* --- diagnóstico semanal --- */
  const comData = P.map(p=>({p, d:dataHora(p)})).filter(x=>x.d);
  const fimS = comData.length ? comData.reduce((a,x)=>x.d>a?x.d:a, comData[0].d) : new Date();
  const iniS = new Date(Date.UTC(fimS.getUTCFullYear(), fimS.getUTCMonth(), fimS.getUTCDate()-6));
  const semana = comData.filter(x=>x.d>=iniS && maduro(x.p)).map(x=>x.p);

  let diag;
  if(!semana.length){
    diag = `<h3>Nenhuma publicação nos últimos 7 dias.</h3>
      <p>O diagnóstico precisa de ao menos uma publicação com mais de 24 h na semana.</p>`;
  } else {
    const forca = VCOMP.map(c=>{
      const M = metasValid();
      return {c, m: semana.reduce((a,p)=>a+Math.min(n(p[c.campo])/M[c.k],1),0)/semana.length};
    }).sort((a,c)=>a.m-c.m);
    const ordem = forca.map(f=>({rot:f.c.rot, cor:f.c.cor, pct:Math.round(f.m*100)}));
    const abaixo = ordem.filter(o=>o.pct<100), acima = ordem.filter(o=>o.pct>=100);
    const crit = abaixo.filter(o=>o.pct<50);
    const validSem = semana.filter(p=>scoreValid(p)>=100).length;
    const melhor = semana.slice().sort((a,c)=>scoreValid(c)-scoreValid(a))[0];
    const cap = t => t.charAt(0).toUpperCase()+t.slice(1);
    const lista = l => l.length>1 ? l.slice(0,-1).join(', ')+' e '+l[l.length-1] : l[0];

    diag = `
      <h3>${abaixo.length===0 ? 'Todos os indicadores atingiram a meta.'
        : crit.length ? `${lista(crit.map((o,i)=>i===0?cap(o.rot):o.rot))} ${crit.length>1?'estão':'está'} abaixo da metade da meta.`
        : `${cap(abaixo[0].rot)} é o indicador mais distante da meta.`}</h3>
      <p><b class="dado">${validSem}</b> de ${semana.length} publicaç${semana.length>1?'ões validadas':'ão validada'} na semana ·
         melhor foi <b>${dataBR(melhor.data)}</b> com <b class="dado">${Math.round(scoreValid(melhor))}%</b>.</p>
      <div class="pc-prio">
        <div class="pc-prio-t">Indicadores por distância da meta</div>
        ${ordem.map((o,i)=>`
          <div class="pr">
            <span class="pos">${i+1}</span>
            <span class="nm"><i style="background:${o.cor}"></i>${o.rot}</span>
            <span class="tr2"><i style="width:${Math.min(o.pct,100)}%;background:${o.cor}"></i></span>
            <span class="pp ${o.pct<50?'crit':o.pct<100?'meio':'ok'}">${o.pct}%</span>
          </div>`).join('')}
      </div>
      <p class="pq">${abaixo.length
        ? `Priorize <b>${abaixo[0].rot}</b>${abaixo.length>1?` e depois <b>${abaixo[1].rot}</b>`:''}.
           ${acima.length?`${lista(acima.map(o=>o.rot))} já ${acima.length>1?'atingiram':'atingiu'} a meta — não é ali que está a perda.`:''}`
        : 'Suba as metas até algum indicador ficar abaixo — meta que todo post bate deixa de medir.'}</p>`;
  }

  const dbr = d => String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0');

  return `
  <section class="pc-passo">
    <header><h2>Como está a página</h2><span class="ap">${P.length} publicações no período</span></header>
    <div class="pc-panel" style="padding:22px 24px">
      <div class="pc-tres">
        <div class="ind">
          <div class="pc-rot">${ICO.reacoes}Reações</div>
          <div class="v">${N(INT)}</div>
          <div class="ref sem">no período</div>
          <div class="cx">curtidas, comentários, salvamentos e compartilhamentos</div>
        </div>
        <div class="ind">
          <div class="pc-rot">${ICO.validadas}Publicações validadas</div>
          <div class="v">${validados} de ${maduros.length}</div>
          <div class="ref ${validados>=mValid?'bom':'ruim'}">meta ${mValid} · <b>${validados>=mValid?'atingida':'não atingida'}</b></div>
          <div class="cx">bateram as quatro metas por publicação</div>
        </div>
        <div class="ind">
          <div class="pc-rot">${ICO.seguidores}Novos seguidores</div>
          <div class="v">${N(novosSeg)}</div>
          <div class="ref ${novosSeg>=mNovos?'bom':'ruim'}">meta ${N(mNovos)} · <b>${novosSeg>=mNovos?'atingida':'não atingida'}</b></div>
          <div class="cx">saldo do período</div>
        </div>
      </div>
    </div>
  </section>

  <section class="pc-passo">
    <header><h2>Dados de engajamento no mês</h2><span class="ap">cada etapa comparada com a sua meta</span></header>
    <div class="pc-panel">
      ${cadeia.map(e=>{
        if(!e.ramo) return `<div class="pc-etapa">${linhaEt(e)}</div>`;
        const esc2 = Math.max(...e.ramo.map(r=>Math.max(r.q,r.meta)))*1.12 || 1;
        return `<div class="pc-etapa ramo">
          <div class="ramo-nota">as duas coisas acontecem em paralelo — uma pessoa pode fazer só uma delas</div>
          ${e.ramo.map(r=>`<div class="sub">${linhaEt(r,esc2)}</div>`).join('')}
        </div>`;
      }).join('')}
    </div>
  </section>

  <section class="pc-passo">
    <header><h2>Validação do público</h2><span class="ap">quanto cada publicação atingiu das metas</span></header>
    <div class="pc-panel pc-valpanel" id="valpanel">
      ${reguaValidacao()}
      ${P.slice().sort((a,c)=>scoreValid(c)-scoreValid(a)).map(p=>{
        const q = partesValid(p), sc = scoreValid(p), md = maduro(p);
        const nivel = !md ? 'novo' : sc>=100 ? 'alto' : 'baixo';
        const tag = !md ? 'ainda medindo' : sc>=100 ? 'validado' : 'não validado';
        return `
        <div class="pc-postv">
          <div>
            <div class="t">${esc(p.titulo)}</div>
            <div class="m">${dataBR(p.data)} · ${N(p.alcance)} visualizadores</div>
          </div>
          <div class="pc-seg">
            ${q.map(x=>`<div class="sg" data-k="${x.k}" style="color:${x.cor}" title="${x.rot}: ${N(x.real)} de ${N(x.alvo)}"><b class="qv">${N(x.real)}</b><div class="s${x.pct>=1?' cheio':''}"><i style="height:${x.pct*100}%;background:${x.cor}"></i></div></div>`).join('')}
          </div>
          <div class="pc-val ${nivel}"><b>${md?Math.round(sc)+'%':'—'}</b><span class="tag">${tag}</span></div>
        </div>`;
      }).join('')}
      <div class="pc-mediaconta">
        <b>${validados}</b> de ${maduros.length} publicações validadas.
        Um post é validado quando bate as quatro metas.
        ${P.length-maduros.length ? `<br><span style="color:var(--mute2)">${P.length-maduros.length} com menos de 24 h fora da conta — ainda medindo.</span>` : ''}
      </div>
    </div>
  </section>

  <section class="pc-passo">
    <header><h2>Diagnóstico</h2><span class="ap">${semana.length?`semana de ${dbr(iniS)} a ${dbr(fimS)} · ${semana.length} publicaç${semana.length>1?'ões':'ão'}`:'sem publicações na semana'}</span></header>
    <div class="pc-panel pc-acao">
      ${diag}
      <div class="rodapinho">recalculado toda segunda-feira</div>
    </div>
  </section>`;
}

function scope(lista){
  if(!lista.length) return `<div class="pc-empty"><span>Nenhum post nesse período.</span></div>`;
  const vals = lista.map(engaj).map(v=>v===null?0:v);
  const ref = n(state.bench.engajamento) || 6;
  const max = Math.max(...vals, ref*1.25, 1);
  const alvoPct = (ref/max)*100;
  const barras = lista.map((p,i)=>{
    const v = vals[i];
    const h = Math.max((v/max)*100, 2);
    return `<div class="pc-bar" data-i="${i}" style="--bc:${FORMATOS[p.formato]||'#515BD4'};height:${h}%" title="${esc(p.titulo)}"></div>`;
  }).join('');
  return `
    <div style="position:relative">
      <div class="pc-scope" id="scope">
        ${barras}
        <div class="pc-target" style="bottom:calc(22px + ${alvoPct}% - ${alvoPct*0.22}px)"><span>REF. ${P(ref,0)}%</span></div>
      </div>
      <div class="pc-scopefoot"><span>${dataBR(lista[0].data)}</span><span>${dataBR(lista[lista.length-1].data)}</span></div>
    </div>`;
}

function estagioHTML(e){
  const v = e.valor;
  const cor = corStatus(v, e.alvo);
  const largura = v===null ? 0 : Math.min((v/(e.alvo*1.6))*100, 100);
  const tick = Math.min((e.alvo/(e.alvo*1.6))*100, 100);
  return `
  <div class="pc-stage">
    <div class="top">
      <span class="nm"><em>${e.cod}</em>${e.nome}</span>
      <span class="val" style="color:${cor}">${v===null?'—':P(v)}% <u>/ ${P(e.alvo,0)}%</u></span>
    </div>
    <div class="pc-track">
      <div class="pc-fill" style="width:${largura}%;background:${cor}"></div>
      <div class="pc-tick" style="left:${tick}%"></div>
    </div>
    <div style="font-family:var(--mono);font-size:10px;color:var(--mute2);margin-top:5px;letter-spacing:.06em">${e.unidade}</div>
  </div>`;
}

function veredito(g, lista){
  if(!g) return `<p class="pc-note">Registre alcance e pelo menos uma métrica de interação para o diagnóstico rodar.</p>`;
  if(g.tipo==='ok') return `
    <div class="pc-verdict good">
      <h4>Sem gargalo</h4>
      <p>Todos os estágios com dados estão na meta.</p>

/* ---------- HISTÓRICO ---------- */
/* Os retratos vem do servidor com os numeros crus. A validacao e recalculada
   aqui com a regua de HOJE, para que semanas distantes sejam comparadas
   com o mesmo criterio — senao a compracao mede mudanca de regua, nao de conteudo. */

async function carregarHistorico(){
  if(hist.estado==='carregando') return;
  hist.estado='carregando'; hist.erro=null;
  try{
    const r = await fetch(HIST_ENDPOINT, {headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d = await r.json();
    hist.itens = Array.isArray(d.itens) ? d.itens : [];
    hist.estado = 'pronto';
    if(!hist.a && hist.itens[0]) hist.a = hist.itens[0].id;
    if(!hist.b && hist.itens[1]) hist.b = hist.itens[1].id;
  }catch(e){
    hist.estado='erro'; hist.erro = e.message;
  }
  render();
}

async function retratoCompleto(id){
  if(!id) return null;
  if(hist.cache[id]) return hist.cache[id];
  try{
    const r = await fetch(HIST_ENDPOINT+'?id='+encodeURIComponent(id));
    if(!r.ok) throw new Error('HTTP '+r.status);
    hist.cache[id] = await r.json();
    return hist.cache[id];
  }catch(e){ return null; }
}

function validadasDe(snap){
  if(!snap || !Array.isArray(snap.posts)) return null;
  const maduros = snap.posts.filter(maduro);
  return { validados: maduros.filter(p=>scoreValid(p)>=100).length, total: maduros.length };
}

const semanaBR = s => {
  if(!s || !s.de) return '—';
  const d = x => x.slice(8,10)+'/'+x.slice(5,7);
  return d(s.de)+' – '+d(s.ate);
};

function viewHistorico(){
  if(hist.estado==='inicio'){ setTimeout(carregarHistorico,0); }

  if(hist.estado==='inicio' || hist.estado==='carregando')
    return `<div class="pc-panel"><p class="pc-note">Lendo o arquivo no servidor…</p></div>`;

  if(hist.estado==='erro')
    return `<div class="pc-panel">
      <div class="pc-sec"><h2>Histórico</h2><span>não foi possível ler</span></div>
      <p class="pc-note">O servidor respondeu <b>${esc(hist.erro||'erro')}</b>.

      na próxima segunda-feira, automaticamente.
      <button class="pc-lnk" id="recarregarHist">tentar de novo</button></p>
    </div>`;

  if(!hist.itens.length)
    return `<div class="pc-panel">
      <div class="pc-sec"><h2>Histórico</h2><span>ainda vazio</span></div>
      <p class="pc-note">Nenhuma semana arquivada ainda. O painel fecha um retrato por semana,
      sozinho, na primeira execução após a segunda-feira. A partir daí esta aba passa a
      comparar as semanas entre si.
      <button class="pc-lnk" id="recarregarHist">verificar de novo</button></p>
    </div>`;

  const A = hist.itens.find(x=>x.id===hist.a) || hist.itens[0];
  const B = hist.itens.find(x=>x.id===hist.b) || null;

  const linhas = [
    {k:'publicacoes',      rot:'publicações'},
    {k:'alcance',          rot:'alcance',           cor:'var(--c-cyan)'},
    {k:'interacoes',       rot:'reações',           cor:'var(--c-blue)'},
    {k:'salvamentos',      rot:'salvamentos',       cor:'var(--c-magenta)'},
    {k:'compartilhamentos',rot:'compartilhamentos', cor:'var(--ig-purple)'},
    {k:'novosSeguidores',  rot:'novos seguidores',  cor:'var(--c-amber)'},
    {k:'seguidores',       rot:'seguidores no fim'}
  ];

  const delta = (a,c) => {
    if(a==null || c==null) return {t:'—', cls:''};
    if(c===0) return a===0 ? {t:'igual', cls:''} : {t:'novo', cls:'ok'};
    const v = (a-c)/c*100;
    if(Math.abs(v)<0.5) return {t:'estável', cls:''};
    return {t:(v>0?'+':'')+Math.round(v)+'%', cls:v>0?'ok':'ruim'};
  };

  return `
  <div class="pc-panel">
    <div class="pc-sec">
      <h2>Semanas arquivadas</h2>
      <span>${hist.itens.length} retrato${hist.itens.length>1?'s':''} · o servidor fecha um por semana</span>
    </div>
    <div class="pc-hist">
      ${hist.itens.map(x=>`
        <div class="hl${x.id===hist.a?' sel-a':''}${x.id===hist.b?' sel-b':''}">
          <div class="per">
            <b>${semanaBR(x)}</b>
            <span>${x.publicacoes} publicaç${x.publicacoes===1?'ão':'ões'}</span>
          </div>
          <div class="nums">
            <span><i style="background:var(--c-cyan)"></i>${N(x.alcance)}</span>
            <span><i style="background:var(--c-blue)"></i>${N(x.interacoes)}</span>
            <span><i style="background:var(--c-amber)"></i>${x.novosSeguidores==null?'—':N(x.novosSeguidores)}</span>
          </div>
          <div class="sel">
            <button class="pc-lnk${x.id===hist.a?' on':''}" data-hist="a" data-id="${x.id}">A</button>
            <button class="pc-lnk${x.id===hist.b?' on':''}" data-hist="b" data-id="${x.id}">B</button>
          </div>
        </div>`).join('')}
    </div>
    <p class="pc-note" style="margin-top:12px">
      Marque duas semanas como <b>A</b> e <b>B</b> para compará-las abaixo.
      A cor de cada número segue a mesma do painel: alcance, reações e novos seguidores.
    </p>
  </div>

  <div class="pc-panel">
    <div class="pc-sec">
      <h2>Comparação</h2>
      <span>${B ? `${semanaBR(A)} contra ${semanaBR(B)}` : 'escolha uma segunda semana'}</span>
    </div>
    ${!B ? `<p class="pc-note">Marque um <b>B</b> na lista acima para ver a variação.</p>` : `
    <div class="pc-cmp">
      <div class="cab">
        <span></span>
        <span class="ca">A · ${semanaBR(A)}</span>
        <span class="cb">B · ${semanaBR(B)}</span>
        <span class="cd">variação</span>
      </div>
      ${linhas.map(l=>{
        const va = A[l.k], vb = B[l.k], d = delta(va,vb);
        return `<div class="lin">
          <span class="rot">${l.cor?`<i style="background:${l.cor}"></i>`:''}${l.rot}</span>
          <span class="va">${va==null?'—':N(va)}</span>
          <span class="vb">${vb==null?'—':N(vb)}</span>
          <span class="vd ${d.cls}">${d.t}</span>
        </div>`;
      }).join('')}
    </div>
    <p class="pc-note" style="margin-top:12px">
      A variação é sempre <b>A em relação a B</b>. Verde e vermelho indicam a direção do número,
      não se aquilo foi bom — uma queda de alcance numa semana sem publicação é esperada,
      não é problema.
    </p>`}
  </div>`;
}

function construtorMeta(d){
  const tipoAg = tipoAgregacao(d.metrica);
  const opcoesAg = AGREGACOES[tipoAg];
  const M = METRICAS[d.metrica] || {};
  const g = progressoMeta(d);
  const existe = state.metas.some(m=>m.id===d.id);

  const sel = (chave,label,opcoes,hint='') => `
    <div class="pc-field">
      <label for="d_${chave}">${label}</label>
      <select id="d_${chave}" data-draft="${chave}">
        ${Object.entries(opcoes).map(([v,t])=>`<option value="${esc(v)}" ${String(d[chave])===String(v)?'selected':''}>${esc(t)}</option>`).join('')}
      </select>
      ${hint?`<span class="hint">${hint}</span>`:''}
    </div>`;

  return `
  <div class="pc-panel" style="border-color:var(--line2)">
    <div class="pc-sec"><h2>${existe?'Editar meta':'Nova meta'}</h2><span>monte a regra — o valor atual é calculado em tempo real</span></div>

    <div class="pc-form">
      <div class="pc-field wide">
        <label for="d_nome">Nome da meta</label>
        <input id="d_nome" data-draftext="nome" type="text" value="${esc(d.nome)}" placeholder="${esc(nomeSugerido(d))}">
        <span class="hint">em branco = ${esc(nomeSugerido(d))}</span>
      </div>

      ${sel('metrica','Métrica', Object.fromEntries(Object.entries(METRICAS).map(([k,v])=>[k,v.nome])))}
      ${sel('agregacao','Como somar', opcoesAg)}
      ${sel('periodo','Período', PERIODOS)}

      ${d.periodo==='custom' ? `
      <div class="pc-field">
        <label for="d_dias">Quantos dias</label>
        <input id="d_dias" data-draftnum="dias" type="number" min="1" step="1" value="${n(d.dias)||30}">
      </div>` : ''}

      ${sel('formato','Só no formato', Object.assign({todos:'Todos os formatos'}, Object.fromEntries(Object.keys(FORMATOS).map(f=>[f,f]))))}
      ${sel('persona','Só na persona', Object.assign({todos:'Todas as personas'}, Object.fromEntries(PERSONAS.map(p=>[p,p]))))}
      ${sel('direcao','Objetivo', {min:'Atingir no mínimo', max:'Manter no máximo'})}

      <div class="pc-field">
        <label for="d_alvo">Alvo${M.pct?' (%)':''}</label>
        <input id="d_alvo" data-draftnum="alvo" type="number" min="0" step="${M.pct?'0.1':'1'}" value="${d.alvo}">
      </div>
    </div>

    <div class="pc-verdict ${g.ok?'good':''}" style="border-left-color:${g.cor}">
      <h4 style="color:${g.cor}">Prévia</h4>
      <p style="font-family:var(--mono);font-size:13px">
        ${esc(d.nome||nomeSugerido(d))} — hoje: <b style="color:${g.cor}">${fmtMeta(d,g.valor)}</b>
        ${d.direcao==='max'?'contra teto de':'de meta'} ${fmtMeta(d,g.alvo)} · ${P(g.pct,0)}%
      </p>
      <p class="fix" style="font-size:12px">${esc(descreveMeta(d))} · ${g.amostra} post${g.amostra===1?'':'s'} entram nessa conta${g.amostra<3?' — amostra pequena demais para confiar.':'.'}</p>
    </div>

    <div class="pc-actions">
      <button class="pc-btn" id="salvarMeta">${existe?'Salvar meta':'Criar meta'}</button>
      <button class="pc-btn ghost" id="cancelarMeta">Cancelar</button>
      <span class="pc-msg ${ui.msg&&ui.msg.err?'err':''}" id="msg">${ui.msg?esc(ui.msg.txt):''}</span>
    </div>
  </div>`;
}
