function flash(txt, err){ ui.msg={txt,err}; render(); setTimeout(()=>{ ui.msg=null; const a=document.getElementById('msg'),b=document.getElementById('msg2'); if(a)a.textContent=''; if(b)b.textContent=''; },2600); }

async function sincronizarInstagram(){
  const btn = document.getElementById('sincronizar');
  const msg = document.getElementById('msgSync');
  if(msg){ msg.className='pc-msg'; msg.textContent='Buscando dados do Instagram…'; }
  if(btn) btn.disabled = true;
  try{
    const r = await fetch(IG_ENDPOINT + '?limit=25', {headers:{'Accept':'application/json'}});
    if(!r.ok){ const t = await r.text(); throw new Error('HTTP '+r.status+' '+t.slice(0,140)); }
    const dados = await r.json();
    if(!dados || !Array.isArray(dados.posts)) throw new Error('resposta inesperada do servidor');
    let novos=0, atualizados=0;
    for(const it of dados.posts){
      const base = {
        data: it.data, ts: it.ts||null, titulo: it.titulo||'(sem legenda)', formato: it.formato||'Reels', persona:'Geral',
        views:n(it.views), alcance:n(it.alcance), interacoes:n(it.interacoes),
        tempoMedio: (it.tempoMedio==null) ? null : n(it.tempoMedio),
        tempoTotal: (it.tempoTotal==null) ? null : n(it.tempoTotal),
        curtidas:n(it.curtidas), comentarios:n(it.comentarios),
        compartilhamentos:n(it.compartilhamentos), salvamentos:n(it.salvamentos),
        visitasPerfil:n(it.visitasPerfil), novosSeguidores:n(it.novosSeguidores),
        retencao: (it.retencao==null||it.retencao==='') ? null : n(it.retencao)
      };
      const existente = it.igId ? state.posts.find(x=>x.igId===it.igId) : null;
      if(existente){ Object.assign(existente, base); atualizados++; }
      else { state.posts.push({id:uid(), igId: it.igId||null, ...base}); novos++; }
    }
    if(n(dados.seguidores)>0) state.seguidores = n(dados.seguidores);
         state.visitasPerfil = (dados.visitasPerfil === null || dados.visitasPerfil === undefined) ? null : n(dados.visitasPerfil);
    state.periodoConta  = n(dados.periodoDias) || 30;
    state.totalPosts    = n(dados.totalPosts) || 0;
    await salvar();
    render();
    const m2 = document.getElementById('msgSync');
    if(m2){ m2.className='pc-msg'; m2.textContent = `Sincronizado: ${novos} novo(s), ${atualizados} atualizado(s).`; }
  }catch(e){
    if(msg){ msg.className='pc-msg err'; msg.textContent = 'Falha: '+e.message; }
    if(btn) btn.disabled=false;
  }
}

function ligarEventos(){
  document.querySelectorAll('[data-periodo]').forEach(b=>b.onclick=()=>{ ui.periodo = b.dataset.periodo==='tudo'?'tudo':Number(b.dataset.periodo); render(); });
  document.querySelectorAll('[data-ordem]').forEach(b=>b.onclick=()=>{ ui.ordem=b.dataset.ordem; render(); });
  document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ ui.tab=b.dataset.goto; render(); });

  document.querySelectorAll('[data-valid]').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = parseInt(inp.value,10);
      state.valid = {...(state.valid||{}), [inp.dataset.valid]: (isFinite(v)&&v>0)?v:0};
      await salvar(); render();
    };
  });
  const rv = document.getElementById('restaurarValid');
  if(rv) rv.onclick = async ()=>{ state.valid = {...DEFAULT_VALID}; await salvar(); render(); };

  document.querySelectorAll('[data-hist]').forEach(btn=>{
    btn.onclick = ()=>{
      const lado = btn.dataset.hist, id = btn.dataset.id;
      if(hist[lado]===id) hist[lado]=null; else hist[lado]=id;
      if(hist.a && hist.a===hist.b) hist[lado==='a'?'b':'a']=null;
      render();
    };
  });
  /* abre um grafico de cada vez na validacao do publico */
  const vpan = document.getElementById('valpanel');
  if(vpan){
    const barras = [...vpan.querySelectorAll('.pc-seg .sg')];
    const grupos = [...vpan.querySelectorAll('.pc-seg')];
    const fechar = ()=>{ barras.forEach(x=>x.classList.remove('aberto'));
                         grupos.forEach(x=>x.classList.remove('aberto')); };
    barras.forEach(sg=>{
      sg.addEventListener('mouseenter', ()=>{
        fechar();                                  // fecha antes de abrir: nunca duas ao mesmo tempo
        sg.classList.add('aberto');
        sg.closest('.pc-seg').classList.add('aberto');
      });
      sg.addEventListener('mouseleave', ()=>{
        sg.classList.remove('aberto');
        sg.closest('.pc-seg').classList.remove('aberto');
      });
    });
    vpan.addEventListener('mouseleave', fechar);
  }

  const rh = document.getElementById('recarregarHist');
  if(rh) rh.onclick = ()=>{ hist.estado='inicio'; render(); };

  document.querySelectorAll('[data-alvo]').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = parseInt(inp.value,10);
      state.alvo = {...(state.alvo||{}), [inp.dataset.alvo]: (isFinite(v)&&v>0)?v:0};
      await salvar(); render();
    };
  });

  document.querySelectorAll('[data-topo]').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = parseInt(inp.value,10);
      state.topo = {...(state.topo||{}), [inp.dataset.topo]: (isFinite(v)&&v>0)?v:0};
      await salvar(); render();
    };
  });
  const rt = document.getElementById('restaurarTopo');
  if(rt) rt.onclick = async ()=>{ state.topo = {...DEFAULT_TOPO}; await salvar(); render(); };

  const sinc = document.getElementById('sincronizar');
  if(sinc) sinc.onclick = sincronizarInstagram;

  // scope
  const lista = postsFiltrados();
  const tip = document.getElementById('tip');
  document.querySelectorAll('.pc-bar').forEach(bar=>{
    const p = lista[Number(bar.dataset.i)];
    const mostrar = ()=>{
      document.querySelectorAll('.pc-bar').forEach(x=>x.classList.remove('on'));
      bar.classList.add('on');
      const e = engaj(p);
      tip.innerHTML = `<b>${dataBR(p.data)} · ${esc(p.titulo)}</b><br>${esc(p.formato)} · alcance ${N(p.alcance)} · engajamento ${e===null?'—':P(e)+'%'} · ${N(interacoes(p))} interações · ${N(p.salvamentos)} salvos · ${N(p.compartilhamentos)} compart.`;
    };
    bar.onmouseenter = mostrar; bar.onclick = mostrar; bar.onfocus = mostrar;
    bar.tabIndex = 0;
  });

  // formulário
  const formEl = document.getElementById('form');
  if(formEl){
    const capturar = ()=> agendarRascunho(Object.fromEntries(new FormData(formEl).entries()));
    formEl.addEventListener('input', capturar);
    formEl.addEventListener('change', capturar);
  }
  const descartar = document.getElementById('descartarRascunho');
  if(descartar) descartar.onclick = async ()=>{ await limparRascunho(); render(); };

  const btn = document.getElementById('salvarPost');
  if(btn) btn.onclick = async ()=>{
    const f = document.getElementById('form');
    const d = Object.fromEntries(new FormData(f).entries());
    if(!d.data || !d.titulo.trim()) return flash('Data e título são obrigatórios.', true);
    if(!(n(d.alcance)>0)) return flash('Alcance precisa ser maior que zero — sem ele nenhuma taxa fecha.', true);
    const limpo = {
      id: ui.editId || uid(),
      data:d.data, titulo:d.titulo.trim(), formato:d.formato, persona:d.persona,
      views:n(d.views), lead:n(d.lead),
      alcance:n(d.alcance),
      retencao: d.retencao==='' ? null : n(d.retencao),
      curtidas:n(d.curtidas), comentarios:n(d.comentarios),
      compartilhamentos:n(d.compartilhamentos), salvamentos:n(d.salvamentos),
      visitasPerfil:n(d.visitasPerfil), novosSeguidores:n(d.novosSeguidores)
    };
    if(ui.editId){ state.posts = state.posts.map(p=>p.id===ui.editId?limpo:p); ui.editId=null; }
    else state.posts.push(limpo);
    await limparRascunho();
    await salvar();
    ui.tab='painel'; flash('Post registrado.', false);
  };
  const cancel = document.getElementById('cancelarEdicao');
  if(cancel) cancel.onclick = async ()=>{ ui.editId=null; ui.tab='posts'; await limparRascunho(); render(); };

  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{ ui.editId=b.dataset.edit; ui.tab='registrar'; render(); });
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Excluir este post do painel?')) return;
    state.posts = state.posts.filter(p=>p.id!==b.dataset.del);
    await salvar(); render();
  });

  // referências do funil e perfil
  document.querySelectorAll('[data-grupo]').forEach(i=>i.onchange=async()=>{
    const v = n(i.value);
    if(i.dataset.grupo==='raiz') state.seguidores = v;
    else state[i.dataset.grupo][i.dataset.chave] = v;
    await salvar(); render();
  });

  // construtor de metas
  const nova = document.getElementById('novaMeta');
  if(nova) nova.onclick = ()=>{ ui.draft = metaVazia(); render(); };

  document.querySelectorAll('[data-editmeta]').forEach(b=>b.onclick=()=>{
    const m = state.metas.find(x=>x.id===b.dataset.editmeta);
    if(m){ ui.draft = {...m}; render(); }
  });
  document.querySelectorAll('[data-dupmeta]').forEach(b=>b.onclick=()=>{
    const m = state.metas.find(x=>x.id===b.dataset.dupmeta);
    if(m){ ui.draft = {...m, id:uid(), nome:(m.nome||nomeSugerido(m))+' (cópia)'}; render(); }
  });
  document.querySelectorAll('[data-delmeta]').forEach(b=>b.onclick=async()=>{
    const m = state.metas.find(x=>x.id===b.dataset.delmeta);
    if(!m || !confirm(`Excluir a meta "${m.nome||nomeSugerido(m)}"?`)) return;
    state.metas = state.metas.filter(x=>x.id!==m.id);
    if(ui.draft && ui.draft.id===m.id) ui.draft=null;
    await salvar(); render();
  });
  document.querySelectorAll('[data-mv]').forEach(b=>b.onclick=async()=>{
    const i = state.metas.findIndex(x=>x.id===b.dataset.mv);
    const j = i + Number(b.dataset.dir);
    if(i<0 || j<0 || j>=state.metas.length) return;
    const arr = [...state.metas];
    [arr[i],arr[j]] = [arr[j],arr[i]];
    state.metas = arr; await salvar(); render();
  });

  // campos do construtor
  document.querySelectorAll('[data-draft]').forEach(el=>el.onchange=()=>{
    if(!ui.draft) return;
    const k = el.dataset.draft;
    ui.draft[k] = el.value;
    if(k==='metrica'){
      const ops = Object.keys(AGREGACOES[tipoAgregacao(ui.draft.metrica)]);
      if(!ops.includes(ui.draft.agregacao)) ui.draft.agregacao = ops[0];
    }
    if(k==='periodo' && el.value==='custom' && !ui.draft.dias) ui.draft.dias = 30;
    render();
  });
  document.querySelectorAll('[data-draftnum]').forEach(el=>el.onchange=()=>{
    if(!ui.draft) return;
    ui.draft[el.dataset.draftnum] = n(el.value);
    render();
  });
  document.querySelectorAll('[data-draftext]').forEach(el=>el.oninput=()=>{
    if(ui.draft) ui.draft[el.dataset.draftext] = el.value;
  });

  const salvarMeta = document.getElementById('salvarMeta');
  if(salvarMeta) salvarMeta.onclick = async ()=>{
    const d = ui.draft; if(!d) return;
    if(!(n(d.alvo)>0)) return flash('Defina um alvo maior que zero.', true);
    const limpo = {...d, nome: (d.nome||'').trim() || nomeSugerido(d), alvo:n(d.alvo), dias:n(d.dias)||30};
    const i = state.metas.findIndex(m=>m.id===limpo.id);
    if(i>=0) state.metas[i] = limpo; else state.metas.push(limpo);
    ui.draft = null;
    await salvar(); flash('Meta salva.', false);
  };
  const cancelarMeta = document.getElementById('cancelarMeta');
  if(cancelarMeta) cancelarMeta.onclick = ()=>{ ui.draft=null; render(); };

  const vincular = document.getElementById('vincular');
  if(vincular) vincular.onclick = async ()=>{
    const ok = await vincularArquivo();
    if(ok) flash('Arquivo vinculado. A partir de agora tudo é gravado direto nele.', false);
    else render();
  };
  const desvincular = document.getElementById('desvincular');
  if(desvincular) desvincular.onclick = async ()=>{
    if(!confirm('Parar de gravar no arquivo? Os dados continuam salvos no navegador, e o arquivo fica onde está.')) return;
    await desvincularArquivo();
    flash('Arquivo desvinculado.', false);
  };

  const exp = document.getElementById('exportar');
  if(exp) exp.onclick = async ()=>{
    state.exportadoEm = new Date().toISOString();
    const texto = JSON.stringify(state,null,2);
    let url = null, revogar = false;
    try{ url = URL.createObjectURL(new Blob([texto],{type:'application/json'})); revogar = true; }
    catch(e){ url = 'data:application/json;charset=utf-8,'+encodeURIComponent(texto); }
    const a = document.createElement('a');
    a.href = url;
    a.download = `metricas-conteudo-${hoje()}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    if(revogar) setTimeout(()=>URL.revokeObjectURL(url), 1000);
    await salvar(); render();
  };
  const imp = document.getElementById('importar');
  if(imp) imp.onclick = ()=>document.getElementById('arquivo').click();
  const arq = document.getElementById('arquivo');
  if(arq) arq.onchange = async ev=>{
    const file = ev.target.files[0]; if(!file) return;
    try{
      const d = JSON.parse(await file.text());
      if(!Array.isArray(d.posts)) throw new Error('formato');
      await guardarBackup();
      aplicar(d);
      await salvar(); flash(`${d.posts.length} posts importados. Dá para desfazer.`, false);
    }catch(e){ flash('Arquivo inválido. Use um JSON exportado por este painel.', true); }
  };
  const desfazer = document.getElementById('desfazer');
  if(desfazer) desfazer.onclick = async ()=>{
    const b = await ler(CHAVE_BACKUP);
    if(!b) return flash('Não há backup para restaurar.', true);
    try{
      aplicar(JSON.parse(b));
      await remover(CHAVE_BACKUP); podeDesfazer = false;
      await salvar(); flash('Estado anterior restaurado.', false);
    }catch(e){ flash('Backup corrompido.', true); }
  };
  const zerar = document.getElementById('zerar');
  if(zerar) zerar.onclick = async()=>{
    if(!confirm('Apagar todos os posts e metas? Um backup fica guardado para desfazer, mas exporte o JSON se quiser garantia.')) return;
    await guardarBackup();
    state = { posts:[], metas:[], bench:{...DEFAULT_BENCH}, valid:{...DEFAULT_VALID}, topo:{...DEFAULT_TOPO}, alvo:{...DEFAULT_ALVO}, seguidores:0, exportadoEm:null };
    ui.draft = null;
    await limparRascunho();
    await salvar(); render();
  };
}

document.querySelectorAll('.pc-tab').forEach(t=>t.onclick=()=>{ ui.tab=t.dataset.tab; ui.editId=null; ui.draft=null; render(); });

/* grava imediatamente ao minimizar, trocar de aba ou fechar.
   localStorage é síncrono, então essa gravação sempre completa;
   as camadas assíncronas (arquivo/Claude) são disparadas em seguida, se der tempo */
function gravarAgora(){
  if(timerRascunho){
    clearTimeout(timerRascunho); timerRascunho = null;
    const f = document.getElementById('form');
    if(f){
      rascunho = {...Object.fromEntries(new FormData(f).entries()), em:new Date().toISOString()};
      escreverLocal(CHAVE_RASCUNHO, JSON.stringify(rascunho));
      escrever(CHAVE_RASCUNHO, JSON.stringify(rascunho));
    }
  }
  state.salvoEm = new Date().toISOString();
  const texto = JSON.stringify(state);
  escreverLocal(KEY, texto);          // síncrono: garantido
  escreverArquivo(texto);             // assíncrono: melhor esforço
  escreverClaude(KEY, texto);
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') gravarAgora(); });
window.addEventListener('pagehide', gravarAgora);

carregar().then(()=>{ render(); sincronizarInstagram(); });
</script>
